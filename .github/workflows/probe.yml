name: Quellen-Sonde (temporär)

# Testet vom Cloud-Runner, welche Schwingen-Quelle ohne WAF-Sperre erreichbar
# ist. Nach der Auswertung wieder entfernen.
on:
  push:
    branches: ["claude/schwingen-gang-prognose-zfeyko"]
    paths:
      - "pipeline/scrape/**"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pdfplumber
        run: pip install pdfplumber
      - name: Sonde
        run: python -m pipeline.scrape.probe
