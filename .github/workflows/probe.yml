name: Discovery-Sonde (temporär)

on:
  push:
    branches: ["claude/schwingen-gang-prognose-zfeyko"]
    paths:
      - "pipeline/scrape/probe.py"
      - ".github/workflows/probe.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pipeline.scrape.probe
