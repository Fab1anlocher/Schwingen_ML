# TEMPORÄR: einmalige Diagnose, wird vor dem Merge entfernt.
name: Quellen-Sonde
on:
  push:
    branches: [claude/moser-kraenze-data-fix-owfy2o]
    paths: [scripts/quellen_sonde.py]
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install pdfplumber
      - run: python scripts/quellen_sonde.py
