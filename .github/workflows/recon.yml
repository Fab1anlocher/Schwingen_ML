name: ESV Recon (Parser-Kalibrierung)

# Läuft auf dem Actions-Runner (offenes Internet, anders als die Build-Sandbox),
# lädt eine echte ESV-Rangliste, druckt die Struktur in die Logs und lädt das
# HTML als Artefakt hoch. Dient der Kalibrierung von pipeline/scrape/esv.py (R-6).
# Push-Trigger auf dem Kalibrier-Branch, damit die Recon ohne Default-Branch-
# Registrierung läuft (workflow_dispatch braucht die Datei auf main). Nur der
# recon-Pfad triggert, damit nicht jeder Commit die Recon startet.
on:
  push:
    branches: ["claude/schwingen-gang-prognose-zfeyko"]
    paths:
      - "pipeline/scrape/**"
      - ".github/workflows/recon.yml"
  workflow_dispatch:
    inputs:
      anlass:
        description: "Anlass-ID (z. B. 3694 = ESAF 2025)"
        type: string
        default: "3694"

jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-pipeline.txt
      - name: Recon ausführen
        run: python -m pipeline.scrape.recon_esv --anlass "${{ github.event.inputs.anlass || '3694' }}"
      - name: HTML-Dumps als Artefakt hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esv-recon-html
          path: recon/
          if-no-files-found: warn
