name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Abhängigkeiten
        run: pip install -r requirements-pipeline.txt
      - name: Tests (Label-Logik §4.3)
        run: python -m pytest pipeline/tests -q
      - name: Pipeline end-to-end (synthetisch) + Inferenz-Check
        run: |
          python -m pipeline.run_pipeline --source synth
          python -m pipeline.verify_inference

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build (Typecheck + Next)
        working-directory: web
        run: npm run build

  # Bekannte Schwachstellen in den Laufzeit-Abhängigkeiten der App. Eigener
  # Job, damit "Sicherheit rot" nicht mit "Build rot" verwechselt wird. Nur
  # --omit=dev: ausgeliefert wird, was in dependencies steht. Ab "high", weil
  # darunter vor allem Build-Werkzeuge ohne Angriffsfläche im Betrieb landen.
  # Anlass: next 14.2.5 lief mit einer kritischen Lücke, ohne dass es auffiel.
  abhaengigkeiten-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit (Produktion, ab high)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  # Die App rechnet jede Prognose selbst in TypeScript (web/lib/inference.ts,
  # web/lib/kopfAnKopf.ts) -- handgespiegelte Kopien der Python-Logik, die
  # verify_inference NICHT prüft. Dieser Job rechnet echte Fälle aus den
  # committeten Artefakten auf beiden Seiten und bricht bei der kleinsten
  # Abweichung ab (s. pipeline/paritaet.py).
  inferenz-paritaet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Abhängigkeiten
        run: |
          pip install -r requirements-pipeline.txt
          cd web && npm ci
      - name: Prüffälle aus den echten Artefakten (Python)
        run: python -m pipeline.paritaet
      - name: Nachrechnen mit der App-Logik (TypeScript)
        working-directory: web
        run: npm run paritaet
