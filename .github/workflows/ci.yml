name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Ältere Läufe desselben Branches abbrechen, wenn neu gepusht wird.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-pipeline.txt
      - name: Abhängigkeiten
        run: pip install -r requirements-pipeline.txt
      - name: Tests (Label-Logik §4.3 + ESV-Parser)
        run: python -m pytest pipeline/tests -q
      - name: Pipeline end-to-end (synthetisch)
        run: python -m pipeline.run_pipeline --source synth
      - name: Inferenz-Parität (LR + GBM == sklearn)
        run: python -m pipeline.verify_inference

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build (Typecheck + Next)
        working-directory: web
        run: npm run build
