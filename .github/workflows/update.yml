name: Modell-Refresh (Cloud)

# NFR-1. WICHTIG: esv.ch blockt Rechenzentrums-IPs (WAF) — echtes Scraping
# läuft NUR vom Heimrechner (siehe README, Abschnitt „Echte ESV-Daten“).
# Dieser Cloud-Workflow trainiert reproduzierbar auf der committeten Datenbasis
# (Default: synthetisch) und aktualisiert die Artefakte.
on:
  schedule:
    - cron: "0 4 * * *" # täglich 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modell-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt

      - name: Pipeline ausführen (synthetisch/Training-Refresh)
        run: python -m pipeline.run_pipeline --source synth

      - name: Artefakte committen (falls geändert)
        run: |
          git config user.name "schwingen-ml-bot"
          git config user.email "actions@github.com"
          git add artifacts/ web/public/data/
          if git diff --staged --quiet; then
            echo "Keine Änderungen an Artefakten."
          else
            git commit -m "chore: Artefakte automatisch aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
    # Vercel deployt automatisch bei neuem Commit (§7).
