name: Daten-Update & Modell (Cloud)

# NFR-1: VOLLAUTOMATISCH. Scrapt schlussgang.ch (statistic-final.pdf, kein WAF
# gegen Cloud-IPs), parst Gänge, trainiert die Modelle und committet die
# Artefakte -> Vercel deployt automatisch. Fest-IDs in pipeline/config.py.
on:
  schedule:
    - cron: "0 4 * * *" # täglich 04:00 UTC
  workflow_dispatch:
    inputs:
      source:
        description: "Datenquelle"
        type: choice
        options: ["schlussgang", "synth"]
        default: "schlussgang"

permissions:
  contents: write

concurrency:
  group: modell-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt

      - name: Pipeline ausführen (Scrape + Training)
        run: python -m pipeline.run_pipeline --source ${{ github.event.inputs.source || 'schlussgang' }}

      - name: Artefakte committen (falls geändert)
        run: |
          git config user.name "schwingen-ml-bot"
          git config user.email "actions@github.com"
          git add artifacts/ web/public/data/
          if git diff --staged --quiet; then
            echo "Keine Änderungen an Artefakten."
          else
            git commit -m "chore: Artefakte automatisch aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
    # Vercel deployt automatisch bei neuem Commit (§7).
