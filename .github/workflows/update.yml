name: Datenpipeline aktualisieren

# NFR-1: neue Feste automatisch < 24 h im Web verfügbar.
on:
  schedule:
    - cron: "0 4 * * *" # täglich 04:00 UTC
  workflow_dispatch:
    inputs:
      voller_refetch:
        description: "Volle Historie ab 2023 neu laden (Cache-Aufbau/-Reparatur, ~15-20 min)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Zwei gleichzeitige Läufe würden sich beim Commit der Artefakte in die Quere
  # kommen und den Rohdaten-Cache widersprüchlich fortschreiben.
  group: datenpipeline
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VOLLER_REFETCH: ${{ github.event.inputs.voller_refetch || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt

      # artifacts/raw wird NICHT committet (gaenge.json allein >50 MB, s.
      # .gitignore) und muss darum über Läufe hinweg gecacht werden -- sonst
      # sieht jeder Cron-Lauf nur das Tagesfenster statt der vollen Historie.
      # Eindeutiger Save-Key + Präfix-Restore = "immer wachsender" Cache.
      - name: Rohdaten-Cache laden
        uses: actions/cache/restore@v4
        with:
          path: artifacts/raw
          key: rohdaten-${{ github.run_id }}
          restore-keys: rohdaten-

      - name: Rohdaten holen (Porträts, Feste, Statistik-PDFs)
        run: |
          if [ "${VOLLER_REFETCH}" = "true" ]; then
            python -m pipeline.fetch_raw --seit-datum 2023-01-01
          else
            python -m pipeline.fetch_raw --seit-datum auto
          fi

      - name: Rohdaten-Cache speichern
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: artifacts/raw
          key: rohdaten-${{ github.run_id }}

      # Bricht ab, statt stillschweigend ein auf Bruchteilen trainiertes Modell
      # zu committen: zu hohe Verlustquote (Verarbeitung kaputt) oder
      # geschrumpfte Rohabdeckung (Cache verloren). Beim bewussten Neuaufbau
      # entfällt nur der Vergleich mit dem Vorlauf, nicht die Verlustprüfung.
      - name: Pipeline ausführen
        run: |
          if [ "${VOLLER_REFETCH}" = "true" ]; then
            python -m pipeline.run_pipeline --source scrape --ohne-volumenpruefung
          else
            python -m pipeline.run_pipeline --source scrape
          fi

      - name: Inferenz-Konsistenz prüfen (JSON == sklearn)
        run: python -m pipeline.verify_inference

      - name: Datenqualität ins Job-Summary
        if: ${{ !cancelled() }}
        run: python -m pipeline.datenqualitaet >> "$GITHUB_STEP_SUMMARY"

      - name: Artefakte committen (falls geändert)
        run: |
          git config user.name "schwingen-ml-bot"
          git config user.email "actions@github.com"
          git add artifacts/ web/public/data/ web/data/
          if git diff --staged --quiet; then
            echo "Keine Änderungen an Artefakten."
          else
            git commit -m "chore: Artefakte automatisch aktualisiert ($(date -u +%Y-%m-%d))"
            git push
          fi
    # Vercel deployt automatisch bei neuem Commit.
