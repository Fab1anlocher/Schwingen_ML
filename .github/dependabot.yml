# Automatische Update-PRs. Anlass: die App lief auf next 14.2.5 mit 3 offenen
# Schwachstellen (1 kritisch), ohne dass es jemand merkte -- und bis 14.2.35,
# der letzten 14er, sind 23 weitere Next-Advisories aufgelaufen, darunter RCE
# in der Image-Optimierung. Next 14 bekommt diese Fixes nicht mehr.
#
# Wöchentlich statt täglich: der tägliche Pipeline-Lauf committet bereits
# jeden Tag; zusätzliche tägliche PRs würden eher ignoriert als gelesen.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # React und seine Typen nur gemeinsam aktualisieren -- getrennt passen
      # Laufzeit und Typdefinitionen zeitweise nicht zusammen.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Kleinkram gebündelt, damit er nicht einzeln die PR-Liste füllt.
      patch-und-minor:
        update-types: ["minor", "patch"]
        exclude-patterns: ["next", "react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # TypeScript 7 ist der neue native Compiler; der Sprung bricht Build
      # und Paritätsprüfung (Dependabot-PR #20). Eigenes Vorhaben, kein
      # Routine-Update.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Typen gehören zur Laufzeit-Version von Node (Vercel/CI: 24), nicht zur
      # neuesten -- sonst erlauben die Typen APIs, die es zur Laufzeit nicht
      # gibt (PR #21 wollte @types/node 26).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pipeline:
        patterns: ["*"]
    ignore:
      # numpy >= 2.5 verlangt Python 3.12; die Pipeline läuft auf 3.11
      # (PR #22 scheiterte daran). Aufheben, sobald die Workflows auf 3.12+
      # umgestellt sind.
      - dependency-name: numpy
        versions: [">=2.5"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Alle Actions in einem PR: einzeln ändern sie oft benachbarte Zeilen
    # derselben Workflows und blockieren sich gegenseitig mit Konflikten.
    groups:
      actions:
        patterns: ["*"]
